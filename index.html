<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Voice Sentiment Analysis</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🎤 Customer Voice Sentiment Analysis</h1>

        <p class="subtitle">
            Speak or enter customer feedback and analyze its sentiment.
        </p>

        <div class="card">

            <textarea id="feedback"
                placeholder="Enter customer feedback here..."></textarea>

            <div class="buttons">

                <button id="startBtn" onclick="startListening()">
                    🎤 Start Voice
                </button>

                <button onclick="analyzeSentiment()">
                    🔍 Analyze
                </button>

                <button class="clear-btn" onclick="clearText()">
                    🗑 Clear
                </button>

            </div>

            <p id="status"></p>

        </div>

        <div id="result" class="result hidden">

            <h2>Analysis Result</h2>

            <div class="result-box">

                <p>
                    <strong>Customer Feedback:</strong>
                </p>

                <p id="resultText"></p>

            </div>

            <div class="result-box">

                <p>
                    <strong>Sentiment:</strong>
                </p>

                <h2 id="sentiment"></h2>

            </div>

            <div class="details">

                <div>
                    <span>Polarity</span>
                    <strong id="polarity"></strong>
                </div>

                <div>
                    <span>Subjectivity</span>
                    <strong id="subjectivity"></strong>
                </div>

            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
